# Moondream captioning — CPU, no accelerator required.
#
#   no accelerator:  docker compose -f docker-compose.yml -f docker-compose.moondream.yml up -d
#   Hailo-8:         docker compose -f docker-compose.yml -f docker-compose.hailo.yml -f docker-compose.moondream.yml up -d
#
# WHY THIS EXISTS
#
# qwen2 captioning needs a Hailo-10H and HailoRT 5.3.0. On a Hailo-8, or on a
# machine with no accelerator at all, it cannot work — so Moondream is the only
# captioning path those machines have.
#
# Moondream runs on the CPU through a Python environment (Snex), which is ~350MB
# and is therefore NOT in the default image. This overlay switches to the
# `-python` variant, which is the same application with that environment kept.
#
# DELIBERATELY NOT A SEPARATE "hailo8" COMPOSE FILE
#
# A Hailo-8 needs nothing structurally different from a Hailo-10H:
# docker-compose.hailo.yml already takes the device node, the group id, the
# host's bindings and the model directory as variables, and hailo-detect.sh
# fills them in for whichever generation is installed. A duplicated hailo8 file
# would differ by a tag and then drift — which is exactly how deploy/web_app.env
# and install.sh once ended up disagreeing about PHX_HOST. Layer this on top of
# the hailo overlay instead; the two are independent concerns.

services:
  photog:
    # Same version, `-python` variant. Overrides the base file's image outright,
    # so PHOTOG_TAG does not apply here — set PHOTOG_PYTHON_TAG instead, and
    # keep the two in step when you upgrade.
    image: tehsnappysoftware/photog:${PHOTOG_PYTHON_TAG:-0.1.2-python}

    environment:
      # Moondream fetches its weights at runtime with `hf_hub_download`
      # (andito/moondream05, moondream-0_5b-int8.mf). Hugging Face's default
      # cache is under $HOME, which in this image is /home/photog — a path on
      # the container's writable layer and NOT on any volume. Left alone, the
      # model is re-downloaded every time the container is recreated, which
      # looks like a slow first caption after every single `up -d`.
      #
      # /app_cache is already a named volume, so point it there.
      HF_HOME: /app_cache/huggingface

      # First caption after a fresh start includes the download and the model
      # load. Give it time before deciding it has hung — the log says
      # "MoondreamServer: starting Python environment and loading model" and
      # then "model ready".

    # A note rather than a setting: the Snex environment pins its own CPython
    # (requires-python == 3.11.*) and uv fetches it at build time, so it is
    # independent of the container's system python 3.13.
    #
    # One interaction to be aware of if you are ALSO using the hailo overlay:
    # that file sets a container-wide PYTHONPATH pointing at the host's
    # hailo_platform, which is a compiled extension built for python 3.13. It is
    # therefore visible to — and unimportable by — Moondream's 3.11 interpreter.
    # Nothing in the Moondream path imports it, so this is inert today, but it
    # is the kind of cross-talk that becomes a baffling ABI error the day
    # something starts scanning that directory.
