# Moondream captioning with the Python environment BAKED INTO THE IMAGE.
#
#   docker compose -f docker-compose.yml -f docker-compose.python.yml up -d
#
# ─────────────────────────────────────────────────────────────────────────────
# YOU ALMOST CERTAINLY DO NOT NEED THIS FILE.
#
# Moondream works on the default image. Tick the classifier in the UI and the
# first enable builds its Python environment — a few minutes once, then it is
# on disk and later starts are quick. There is no separate image to pull and no
# overlay to add.
#
# THE TAG THIS FILE SELECTS IS NOT PUBLISHED. Up to 0.1.4 the `-python` variant
# was built and pushed alongside every release. It is not any more: the default
# image carries the venv's pyproject.toml and uv.lock plus `uv`, and
# PhoTog.Classifications.PythonEnv builds the environment on demand from the
# lock file. `docker compose pull` with this overlay will fail to find the image.
# ─────────────────────────────────────────────────────────────────────────────
#
# WHAT IT IS STILL FOR
#
# One case, and it is a real one: **an install that cannot reach the internet
# when somebody enables the classifier.** The runtime build fetches CPython from
# python-build-standalone and wheels from PyPI. Air-gapped, heavily firewalled
# or metered installs need the environment to arrive with the image.
#
# It also sidesteps a smaller risk the runtime path carries. uv.lock pins
# versions, but it cannot promise those artifacts are still fetchable in a
# year — a yanked wheel or a PyPI outage turns "enable Moondream" into a load
# error on a machine that a baked image would have run.
#
# To use it, build and push the variant yourself from the application repo:
#
#   PYTHON_VARIANT=1 ./deploy/docker/build-and-push.sh 0.1.5
#
# then set REGISTRY if you are pushing somewhere other than the public repo, and
# add this overlay to COMPOSE_FILE.
#
# DELIBERATELY NOT A SEPARATE "hailo8" COMPOSE FILE
#
# A Hailo-8 needs nothing structurally different from a Hailo-10H:
# docker-compose.hailo.yml already takes the device node, the group id, the
# host's bindings and the model directory as variables, and env-detect.sh
# fills them in for whichever generation is installed. A duplicated hailo8 file
# would differ by a tag and then drift — which is exactly how deploy/web_app.env
# and install.sh once ended up disagreeing about PHX_HOST. Layer this on top of
# the hailo overlay instead; the two are independent concerns.

services:
  photog:
    # Same version, `-python` suffix. Compose interpolates first and
    # concatenates after, so the suffix lands outside the substitution and there
    # is no second variable to keep in step with PHOTOG_TAG.
    #
    # Nothing publishes this tag — see the header.
    image: tehsnappysoftware/photog:${PHOTOG_TAG:-0.1.4}-python

    # HF_HOME used to be set here. It is in the image now, so that the default
    # image gets it too: Moondream fetches its weights with `hf_hub_download`
    # and Hugging Face's default cache is under $HOME, which is on the
    # container's writable layer rather than a volume — left alone, the model
    # re-downloads every time the container is recreated, which reads as a slow
    # first caption after every single `up -d`.

    # A note rather than a setting: the Snex environment pins its own CPython
    # (requires-python == 3.11.*), independent of the container's system
    # python 3.13.
    #
    # One interaction to be aware of if you are ALSO using the hailo overlay:
    # that file sets a container-wide PYTHONPATH pointing at the host's
    # hailo_platform, which is a compiled extension built for python 3.13. It is
    # therefore visible to — and unimportable by — Moondream's 3.11 interpreter.
    # Nothing in the Moondream path imports it, so this is inert today, but it
    # is the kind of cross-talk that becomes a baffling ABI error the day
    # something starts scanning that directory.
