# PhoTog reverse proxy — mounted over /etc/nginx/conf.d/default.conf.
#
# It exists for one reason: to put PhoTog on port 80. Everything downstream
# assumes that. `image_url_base` defaults to `http://$PHX_HOST` with no port,
# the iOS/tvOS apps' Release `PHOTOG_WEB_HOST` is `http://photog.local`, and
# both are wrong the moment the app answers on :4000 instead.
#
# This file is included from the official image's `http` block, so `map` and
# `server` are both in scope here.

# Phoenix's websocket transports (LiveView at /live, the native clients at
# /socket) need the Upgrade/Connection pair proxied verbatim. Hardcoding
# `Connection: upgrade` breaks every ordinary request; this maps it per request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80 default_server;
    server_name _;

    # Deliberately no `listen [::]:80`. Docker's default bridge network is
    # IPv4-only, and on a host booted with ipv6.disable=1 the bind fails with
    # "Address family not supported by protocol" — which does not degrade to
    # IPv4, it stops nginx from starting at all. Add it back if you have given
    # the compose network IPv6.

    # Docker's embedded DNS. Deliberately NOT an `upstream photog { ... }`
    # block: nginx resolves those once at startup and caches the address
    # forever, so the next `docker compose pull && up -d` gives the app
    # container a new IP and the proxy serves 502 until it is restarted by
    # hand. Re-resolving through a variable costs a DNS lookup every 10s and
    # removes a failure mode that only shows up on upgrade day.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $photog_upstream http://photog:4000;

    # Uploads from the iOS/macOS clients are whole-file POSTs of raw image
    # data — PhoenixClient.uploadFile/4 sends the entire Data in one request
    # and UploadController.read_full_body/2 accepts any size. nginx's 1MB
    # default would reject every one of them. A 100MP RAW is comfortably under
    # this; lower it if you want a real cap.
    client_max_body_size 1024m;

    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Phoenix builds absolute URLs from its own endpoint config, not from the
    # Host header, so it does not matter here that $host omits the port. What
    # does matter is `check_origin`: the browser sends the PUBLIC port in
    # Origin, so if you publish this proxy on anything other than 80, the
    # compose file has to pass a matching PHOTOG_CHECK_ORIGIN or every
    # LiveView socket is rejected while the pages still render.

    location /api/uploads {
        # Stream the body straight through. With buffering on (the default)
        # nginx writes the whole upload to /var/cache/nginx before contacting
        # Phoenix — on a Pi that is a full extra write of every photo to the
        # SD card, and it stalls the client for the duration.
        proxy_request_buffering off;

        # PhoenixClient's URLSession uses a 120s request timeout and 300s
        # resource timeout. Stay above both so nginx is never the one to give
        # up first.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_pass $photog_upstream$request_uri;
    }

    location / {
        # Long enough for an idle websocket to survive between heartbeats.
        # Phoenix's default heartbeat is 30s, so 60s (nginx's default) would
        # usually hold — but "usually" here means intermittent reconnect
        # storms on a busy Pi, which is worse to diagnose than it is to avoid.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass $photog_upstream$request_uri;
    }
}
